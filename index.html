    <script>
    function convertLink() {
        let url = document.getElementById("ytLink").value.trim();
        let videoId = null;

        // Match normal YouTube link
        let match = url.match(/v=([a-zA-Z0-9_-]{11})/);
        if (match) {
            videoId = match[1];
        }

        // Match youtu.be short link
        let short = url.match(/youtu\.be\/([a-zA-Z0-9_-]{11})/);
        if (short) {
            videoId = short[1];
        }

        if (videoId) {
            let embedUrl = "https://invidious.nerdvpn.de/watch?v=" + videoId;
            window.open(embedUrl, "_blank"); // 👈 opens in new tab/window
